<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetVision Cyber HUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes radar {
            0% { transform: translateY(-100%); opacity: 0.1; }
            50% { opacity: 0.8; }
            100% { transform: translateY(1000%); opacity: 0.1; }
        }
        .scanner-line {
            animation: radar 2s linear infinite;
        }
    </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-mono select-none">

    <!-- Terminal HUD Wrapper -->
    <div class="max-w-2xl w-full bg-slate-950 border-2 border-cyan-500/40 rounded-3xl p-6 shadow-[0_0_50px_rgba(6,182,212,0.15)] relative overflow-hidden">
        
        <!-- Header / Control bar -->
        <div class="flex justify-between items-center border-b border-cyan-500/20 pb-4 mb-5">
            <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></span>
                <span class="text-lg font-black tracking-widest text-cyan-400 uppercase">NEURAL SCANNER // HUD</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="voiceToggle" class="px-3 py-1 text-xs border border-cyan-500/40 rounded-lg text-cyan-300 hover:bg-cyan-500/10">
                    🔊 AI Voice: ON
                </button>
            </div>
        </div>

        <!-- Mode Selector -->
        <div class="flex gap-3 mb-5">
            <button id="btnUploadMode" class="flex-1 py-2 text-xs uppercase tracking-wider rounded-xl bg-cyan-500/20 border border-cyan-500 text-cyan-300 font-bold transition">
                📁 File Upload
            </button>
            <button id="btnCamMode" class="flex-1 py-2 text-xs uppercase tracking-wider rounded-xl bg-slate-900 border border-slate-800 text-slate-400 font-bold hover:text-cyan-300 transition">
                📷 Live Webcam
            </button>
        </div>

        <!-- Viewport Container -->
        <div class="relative w-full aspect-video bg-slate-900/60 rounded-2xl border border-dashed border-cyan-500/30 overflow-hidden flex items-center justify-center">
            
            <!-- File Mode Upload Display -->
            <div id="fileBox" class="flex flex-col items-center justify-center cursor-pointer w-full h-full p-4">
                <input type="file" id="fileInput" class="hidden" accept="image/*">
                <img id="previewImage" src="" class="hidden max-h-full max-w-full object-contain rounded-lg">
                <div id="uploadPrompt" class="text-center">
                    <p class="text-cyan-400 text-sm font-bold">CLICK OR DRAG IMAGE HERE</p>
                    <p class="text-slate-500 text-[10px] mt-1">Supports All Animals, Birds, Vehicles & Objects</p>
                </div>
            </div>

            <!-- Webcam Video Feed -->
            <video id="webcam" class="hidden w-full h-full object-cover" autoplay playsinline muted></video>
            <canvas id="snapshotCanvas" class="hidden"></canvas>

            <!-- Sci-Fi Reticle Overlay -->
            <div id="scannerLine" class="scanner-line hidden absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_15px_#22d3ee]"></div>
            <div class="pointer-events-none absolute inset-4 border border-cyan-500/10 rounded-xl flex items-center justify-center">
                <div class="w-16 h-16 border-t-2 border-l-2 border-cyan-400/40 absolute top-0 left-0"></div>
                <div class="w-16 h-16 border-t-2 border-r-2 border-cyan-400/40 absolute top-0 right-0"></div>
                <div class="w-16 h-16 border-b-2 border-l-2 border-cyan-400/40 absolute bottom-0 left-0"></div>
                <div class="w-16 h-16 border-b-2 border-r-2 border-cyan-400/40 absolute bottom-0 right-0"></div>
            </div>
        </div>

        <!-- Scan Trigger Button -->
        <button id="scanBtn" class="mt-5 w-full py-3.5 rounded-2xl font-black tracking-widest uppercase text-sm bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-black shadow-[0_0_25px_rgba(6,182,212,0.4)] active:scale-[0.99] transition duration-200">
            ⚡ INITIATE SCAN
        </button>

        <!-- Top-3 Diagnostic Feed -->
        <div id="hudResult" class="hidden mt-6 p-4 bg-slate-900/80 border border-cyan-500/30 rounded-2xl">
            <div class="flex justify-between items-center mb-3">
                <span class="text-[11px] text-cyan-400">IDENTIFIED TARGET: <b id="mainLabel" class="text-white text-base ml-1">--</b></span>
                <span id="latencyText" class="text-[10px] text-emerald-400 bg-emerald-950/60 px-2 py-0.5 rounded border border-emerald-500/30">0 ms</span>
            </div>

            <div id="top3List" class="space-y-2">
                <!-- Dynamic confidence bars inject here -->
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
